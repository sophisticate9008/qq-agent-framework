</style></head><body><div class="app"><button class="nav-backdrop" data-nav-close aria-label="收起导航"></button><aside class="sidebar"><div class="brand"><i aria-hidden="true">✦</i>配置工作台<button class="nav-close" data-nav-close aria-label="关闭导航">×</button></div><nav id="nav" class="nav" aria-label="设计页面"></nav><div class="side-bottom">完整功能设计稿 · v3<br>布局待审核，所有数据均为示例<br><button class="link" data-open="preview-help">如何查看设计</button></div></aside><div class="workspace"><header class="topbar"><button class="menu-toggle" data-nav-toggle aria-label="展开导航">☰</button><strong id="breadcrumb">连接与概览</strong><span class="review-tag">独立设计稿</span><button class="ghost push" data-open="preview-search">⌕ 搜索</button><button class="ghost" data-open="preview-appearance" aria-label="显示模式">☼</button><label class="mode"><select id="state-mode" aria-label="查看状态样例"><option value="normal">常态布局</option><option value="loading">加载状态</option><option value="error">读取失败</option><option value="unknown">结果未确认</option></select></label><button class="ghost" data-open="preview-help">说明</button></header><main id="views"></main></div></div><div id="toast" class="toast" role="status" hidden></div><script>
'use strict';
window.UI={pages:{},dialogs:{},actions:{},state:'normal',current:'overview'};
UI.esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
UI.badge=(text,tone='good')=>`<span class="badge ${UI.esc(tone)}">${UI.esc(text)}</span>`;
UI.button=(text,attrs='',kind='')=>`<button type="button" class="${UI.esc(kind)}" ${attrs}>${text}</button>`;
UI.tip=text=>`<button type="button" class="tip" data-tip="${UI.esc(text)}" aria-label="${UI.esc(text)}">ⓘ</button>`;
let fieldSequence=0;
UI.field=(label,value='',options={})=>{const id=`demo-field-${++fieldSequence}`;return `<div class="setting ${options.wide?'spanall':''}"><label for="${id}">${UI.esc(label)}</label><input id="${id}" type="${UI.esc(options.type||'text')}" value="${UI.esc(value)}" ${options.placeholder?`placeholder="${UI.esc(options.placeholder)}"`:''} ${options.disabled?'disabled':''} ${options.attrs||''}>${options.tip?UI.tip(options.tip):''}</div>`};
UI.select=(label,values,options={})=>{const id=`demo-field-${++fieldSequence}`;return `<div class="setting ${options.wide?'spanall':''}"><label for="${id}">${UI.esc(label)}</label><select id="${id}" ${options.disabled?'disabled':''} ${options.attrs||''}>${values.map(v=>{const text=typeof v==='object'?v.label:v;const value=typeof v==='object'?v.value:v;return `<option value="${UI.esc(value)}" ${options.value===value?'selected':''}>${UI.esc(text)}</option>`}).join('')}</select>${options.tip?UI.tip(options.tip):''}</div>`};
UI.area=(label,value='',rows=8)=>{const id=`demo-field-${++fieldSequence}`;return `<div class="textarea-field"><label for="${id}">${UI.esc(label)}</label><textarea id="${id}" rows="${Number(rows)||8}">${UI.esc(value)}</textarea></div>`};
UI.check=(label,on=false)=>`<label class="check"><input type="checkbox" ${on?'checked':''}>${UI.esc(label)}</label>`;
UI.panel=(title,body,actions='',cls='')=>`<section class="panel ${cls}"><div class="panelhead"><h2>${title}</h2><div class="row">${actions}</div></div><div class="panelbody">${body}</div></section>`;

const restore=(root,values)=>{if(!values)return;controls(root).forEach((input,index)=>{if(values[index]){input.value=input.type==='password'?'':values[index].value;if('checked' in input)input.checked=values[index].checked}});root.querySelectorAll('[data-credential-action],[data-execution-notice-toggle],[data-execution-cancel-toggle],[data-records-confirm]').forEach(input=>input.dispatchEvent(new Event('change',{bubbles:true})))};
UI.notify=message=>{const node=document.getElementById('toast');node.textContent=message;node.hidden=false;clearTimeout(timer);timer=setTimeout(()=>{node.hidden=true},4200)};
UI.close=()=>{const dialog=dialogs.pop();if(dialog)dialog.close()};
UI.open=(id,options={})=>{const definition=UI.dialogs[id];if(!definition){UI.notify('此入口的设计内容正在整理');return}const existing=dialogs.find(d=>d.dataset.dialog===id);if(existing){dialogs.splice(dialogs.indexOf(existing),1);existing.close();}const dialog=document.createElement('dialog');dialog.className=`dialog ${definition.wide?'wide':''} ${definition.drawer?'drawer':''}`;dialog.dataset.dialog=id;dialog.setAttribute('aria-label',definition.title.replace(/<[^>]+>/g,''));dialog.innerHTML=`<div class="dialoghead"><div><h2>${definition.title}</h2>${definition.sub?`<p class="muted small">${definition.sub}</p>`:''}</div><button class="close" data-close aria-label="关闭">×</button></div><div class="dialogbody">${definition.render()}</div>`;document.body.append(dialog);if(!options.fresh)restore(dialog,dialogDrafts.get(id));dialogs.push(dialog);dialog.addEventListener('close',()=>{dialogDrafts.set(id,capture(dialog));const index=dialogs.indexOf(dialog);if(index>=0)dialogs.splice(index,1);dialog.remove()},{once:true});dialog.addEventListener('click',event=>{if(event.target===dialog){const rect=dialog.getBoundingClientRect();if(event.clientX<rect.left||event.clientX>rect.right||event.clientY<rect.top||event.clientY>rect.bottom)dialog.close()}});dialog.showModal()};
UI.render=()=>{const page=UI.pages[UI.current];if(!page)return;document.getElementById('state-mode').value=UI.state;document.getElementById('breadcrumb').textContent=page.title;document.querySelectorAll('.nav button').forEach(button=>{const active=button.dataset.page===UI.current;button.classList.toggle('active',active);button.setAttribute('aria-current',active?'page':'false')});const stateNote={normal:'',loading:'加载状态演示：以下示例展示读取中的布局。',error:'异常状态演示：保留已有内容，提示原因与下一步。',unknown:'结果未知演示：保留原操作，不能把未知显示成成功。'}[UI.state];main.innerHTML=`<div class="pagehead"><h1>${page.title}</h1><p>${page.sub||''}</p><div class="row"><button class="ghost" data-action="refresh-preview">刷新</button></div></div>${stateNote?`<div class="strip ${UI.state==='error'?'bad':'warn'} state-banner">${stateNote}</div>`:''}${page.render()}`;document.title=`${page.title} · 完整功能设计稿`;document.dispatchEvent(new CustomEvent('preview:render',{detail:{page:UI.current}}))};
UI.navigate=id=>{if(!UI.pages[id])return;pageDrafts.set(UI.current,capture(main));while(dialogs.length)UI.close();UI.current=id;UI.render();restore(main,pageDrafts.get(id));history.replaceState(null,'','#'+id);document.body.classList.remove('nav-open');window.scrollTo({top:0,behavior:'instant'})};
UI.actions['refresh-preview']=()=>{UI.notify('设计稿已刷新示例显示，未读取真实服务');UI.render()};
UI.dialogs['preview-search']={title:'搜索配置与页面',sub:'静态设计稿内搜索，不读取真实配置',render:()=>`<div class="stack"><input aria-label="搜索设置" placeholder="搜索人设、白名单、模型、会话…" data-filter="preview-search-results"><div id="preview-search-results">${nav.map(([id,icon,label])=>`<div class="listrow" data-search-row><span class="letter">${icon}</span><strong class="grow">${label}</strong><button class="link" data-page="${id}">打开</button></div>`).join('')}</div><div class="strip">正式搜索还定位到具体配置字段；不触发保存或应用。</div></div>`};
UI.dialogs['preview-appearance']={title:'显示模式',sub:'外观预览',render:()=>`<div class="stack"><div class="setting"><label for="preview-theme">显示模式</label><select id="preview-theme" data-preview-theme><option value="light">日间模式</option><option value="dark">夜间模式</option><option value="system">跟随系统</option></select></div><p class="muted small">此选项只改变当前设计稿的颜色，不修改正式控制台。</p><div class="footer"><button data-close>完成</button><button class="ghost" data-open="preview-login">登录窗口样式</button></div></div>`};
UI.dialogs['preview-login']={title:'连接配置工作台',sub:'登录窗口设计 · 不进行真实认证',render:()=>`<div class="stack"><div class="strip">实际使用时，从本机令牌文件复制管理员令牌，创建浏览器访问会话。</div><div class="setting"><label for="preview-token">管理员令牌</label><input id="preview-token" type="password" autocomplete="off" placeholder="仅展示输入框，请勿输入真实令牌"></div><p class="muted small">登录后用于管理配置；QQ 主人身份仍由主人账号设置决定。</p><div class="footer"><button class="primary" data-save="已演示进入工作台，未执行认证">进入工作台</button></div></div>`};
document.addEventListener('change',event=>{if(event.target.matches('[data-preview-theme]')){const theme=event.target.value;document.body.classList.toggle('dark',theme==='dark'||theme==='system'&&matchMedia('(prefers-color-scheme: dark)').matches)}});
UI.dialogs['preview-help']={title:'设计稿审核说明',sub:'当前只审核布局与功能入口',wide:true,render:()=>`<div class="stack"><div class="strip">所有页面为离线设计稿；不请求真实接口、不改配置、不重启服务。</div><div class="grid2"><div><h3>可查看内容</h3><p class="muted">九个页面；实体卡片、目录编辑、短字段分组、表格、日志、编辑弹窗、详情侧窗和确认操作。</p></div><div><h3>真实能力范围</h3><p class="muted">功能依据当前源码整理。页面里的名称、数字、时间都是演示数据，不代表实际运行状态。</p></div></div><div class="grid2"><div><h3>主要交互</h3><p class="muted">切换左侧导航和页签，打开设置、查看详情、筛选列表；目录与部分配置可模拟编辑。顶部可切换状态样例。</p></div><div><h3>确认之后</h3><p class="muted">先渲染此静态稿，再按画面逐页实现内容分布、卡片比例、颜色与操作位置；业务沿用现有保存与恢复逻辑。</p></div></div><div class="footer"><button class="primary" data-close>继续看设计</button></div></div>`};
UI.dialogs['preview-confirm']={title:'确认删除',sub:'仅演示确认交互',render:()=>`<div class="stack"><strong>${UI.esc(UI.confirmTarget||'所选对象')}</strong><div class="strip warn">${UI.esc(UI.confirmImpact||'正式操作删除后无法撤销。')}</div><p class="muted small">本设计稿不删除真实数据。</p><div class="footer"><span class="push"></span><button data-close>取消</button><button class="primary danger" data-action="confirm-demo">确认删除</button></div></div>`};
UI.actions['confirm-demo']=()=>{UI.close();UI.notify('已演示删除确认；真实数据未改变')};
document.getElementById('nav').innerHTML=nav.map(([id,icon,label],index)=>`<button type="button" data-page="${id}"><span class="symbol" aria-hidden="true">${icon}</span><span>${label}</span><span class="ordinal" aria-hidden="true">${String(index+1).padStart(2,'0')}</span></button>`).join('');
document.addEventListener('click',event=>{const button=event.target.closest('button,[data-open],[data-page],[data-action]');if(!button||button.disabled)return;if(button.hasAttribute('data-nav-toggle')){document.body.classList.toggle('nav-open');return}if(button.hasAttribute('data-nav-close')){document.body.classList.remove('nav-open');return}if(button.dataset.page){UI.navigate(button.dataset.page);return}if(button.dataset.action&&UI.actions[button.dataset.action]){UI.actions[button.dataset.action](button,event)}if(button.dataset.open)UI.open(button.dataset.open);if(button.hasAttribute('data-close'))UI.close();if(button.hasAttribute('data-confirm')){UI.confirmTarget=button.dataset.confirm;UI.confirmImpact=button.dataset.impact;UI.open('preview-confirm',{fresh:true})}if(button.dataset.save){if(button.closest('dialog'))UI.close();UI.notify(button.dataset.save+'（仅设计演示）')}if(button.dataset.demo)UI.notify(button.dataset.demo+'（未访问真实服务）');if(button.dataset.tab){const group=button.dataset.tabGroup;document.querySelectorAll('[data-tab-group]').forEach(tab=>{if(tab.dataset.tabGroup!==group)return;const active=tab===button;tab.classList.toggle('active',active);tab.setAttribute('aria-selected',String(active))});document.querySelectorAll('[data-tab-panel]').forEach(panel=>{if(panel.dataset.tabPanel.startsWith(group+'-'))panel.hidden=panel.dataset.tabPanel!==button.dataset.tab})}if(button.hasAttribute('data-select-item')){const list=button.closest('.masterlist');list?.querySelectorAll('[data-select-item]').forEach(item=>item.classList.toggle('active',item===button));UI.onSelect?.(button)}});
document.addEventListener('input',event=>{const input=event.target;if(input.dataset.filter){const target=document.getElementById(input.dataset.filter);target?.querySelectorAll('[data-search-row],tbody tr,.listrow').forEach(row=>row.hidden=!row.textContent.toLowerCase().includes(input.value.trim().toLowerCase()))}});
document.getElementById('state-mode').addEventListener('change',event=>{UI.state=event.target.value;UI.render()});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){document.body.classList.remove('nav-open');hideTip()}});
let tipNode=null;function hideTip(){tipNode?.remove();tipNode=null}function showTip(target){hideTip();if(!target?.dataset.tip)return;tipNode=document.createElement('div');tipNode.className='tooltip';tipNode.role='tooltip';tipNode.textContent=target.dataset.tip;(target.closest('dialog')||document.body).append(tipNode);const rect=target.getBoundingClientRect();const left=Math.max(8,Math.min(rect.left,innerWidth-tipNode.offsetWidth-8));const top=rect.bottom+6+tipNode.offsetHeight<innerHeight?rect.bottom+6:Math.max(8,rect.top-tipNode.offsetHeight-6);tipNode.style.left=left+'px';tipNode.style.top=top+'px'}
document.addEventListener('pointerover',event=>{const target=event.target.closest('[data-tip]');if(target)showTip(target)});document.addEventListener('pointerout',event=>{if(event.target.closest('[data-tip]'))hideTip()});document.addEventListener('focusin',event=>{const target=event.target.closest('[data-tip]');if(target)showTip(target)});document.addEventListener('focusout',hideTip);document.addEventListener('click',event=>{const target=event.target.closest('[data-tip]');if(target)showTip(target);else hideTip()});
UI.current=Object.hasOwn(UI.pages,location.hash.slice(1))?location.hash.slice(1):'overview';UI.render();
})();

</script></body></html>
